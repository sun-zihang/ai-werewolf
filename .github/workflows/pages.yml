name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci --prefix web
      - name: Build web
        run: npm run build --prefix web
        env:
          # 指向已部署的 Cloudflare 后端（Pages Functions + D1，固定公网地址）。
          # GitHub Pages 仅托管前端，后端在另一域名，靠跨域（后端已开 CORS:*）调用。
          VITE_API_BASE: "https://ai-werewolf.pages.dev"
          # Cloudflare Turnstile 站点公钥（公开，构建期内联到前端，触发人机验证 widget）
          VITE_TURNSTILE_SITEKEY: "0x4AAAAAAERt6ddLMl7mmBRd"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4